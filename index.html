<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو مشويات الشرق</title>
<style>
:root{--lift:60px;--bg:#f6f0e4;--surf:#fffaf0;--ink:#241a12;--mut:#7a6a58;--gold:#a8731a;--red:#b3262e;--line:#e3d6bd;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110d;--surf:#221b14;--ink:#f5ead8;--mut:#b5a58e;--gold:#e3b04b;--red:#e2555c;--line:#3a2e22;--onacc:#1a1208}}
:root[data-theme="dark"]{--bg:#15110d;--surf:#221b14;--ink:#f5ead8;--mut:#b5a58e;--gold:#e3b04b;--red:#e2555c;--line:#3a2e22;--onacc:#1a1208}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:130px}
body{background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;padding-bottom:calc(110px + var(--lift));min-height:100vh}
header{text-align:center;padding:26px 16px 14px;border-bottom:3px double var(--gold)}
header h1{font-size:30px;font-weight:800;color:var(--gold);letter-spacing:.5px}
header p{color:var(--mut);font-size:14px;margin-top:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.bar input{width:100%;padding:11px 16px;border-radius:24px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:15px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-top:9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--gold);color:var(--onacc);border-color:var(--gold);font-weight:700}
main{padding:6px 12px;max-width:720px;margin:auto}
h2{font-size:19px;margin:20px 4px 10px;color:var(--gold);border-right:4px solid var(--red);padding-right:10px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nm{font-weight:700;font-size:16px}
.pr{color:var(--gold);font-weight:800;font-size:18px;white-space:nowrap}
.pr small{font-size:12px;font-weight:600;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.chips button{padding:5px 11px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chips button.on{border-color:var(--gold);background:var(--gold);color:var(--onacc);font-weight:700}
.act{margin-top:10px;display:flex;justify-content:flex-end}
.add{padding:8px 18px;border:0;border-radius:10px;background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.qty{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--gold);border-radius:10px;padding:3px 6px}
.qty b{min-width:20px;text-align:center}
.qty button,.q2 button{width:32px;height:32px;border-radius:8px;border:0;background:var(--gold);color:var(--onacc);font-size:19px;font-weight:700;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:40px 0}
#fab{position:fixed;inset-inline:0;bottom:0;z-index:8;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px) + var(--lift));display:none}
#fab button{width:100%;max-width:720px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border:0;border-radius:16px;background:var(--gold);color:var(--onacc);font:inherit;font-size:16px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.pane{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px) + var(--lift))}
.ph{display:flex;justify-content:space-between;align-items:center}
.ph h3{font-size:20px;color:var(--gold)}
.x{background:none;border:0;color:var(--ink);font-size:26px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1;font-size:14px}.row .t small{display:block;color:var(--mut)}
.q2{display:flex;align-items:center;gap:8px}
.tot{display:flex;justify-content:space-between;font-size:19px;font-weight:800;padding:14px 0}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mode button{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.mode button.on{background:var(--red);border-color:var(--red);color:#fff}
.pane input,.pane textarea{width:100%;padding:11px 13px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:15px}
.send{width:100%;padding:14px;border:0;border-radius:14px;background:#1fa855;color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
.im{width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:var(--bg)}
.bd{font-size:11px;background:var(--red);color:#fff;padding:2px 8px;border-radius:10px;margin-inline-start:6px;vertical-align:middle;font-weight:700}
.closed{background:var(--red);color:#fff;text-align:center;padding:10px;font-weight:700;font-size:14px}
.fee{display:flex;justify-content:space-between;color:var(--mut);padding-top:10px}
.loc{width:100%;padding:10px;margin-bottom:8px;border-radius:10px;border:1px dashed var(--gold);background:transparent;color:var(--gold);font:inherit;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header><h1 id="rn">🔥 مشويات الشرق</h1><p>مشويات · طواجن · محاشي · ساندوتشات — اطلب الآن عبر واتساب</p></header>
<div class="closed" id="cb" style="display:none">⛔ المطعم مغلق حالياً — يمكنك تصفح المنيو فقط</div>
<div class="bar"><input id="q" type="search" placeholder="🔍 ابحث عن صنف..."><div class="tabs" id="tabs"></div></div>
<main id="list"></main>
<div id="fab"><button id="fabBtn"><span id="fc"></span><span>عرض السلة 🛒</span><span id="ft"></span></button></div>
<div id="sheet"><div class="pane">
<div class="ph"><h3>🛒 سلة الطلب</h3><button class="x" id="cl" aria-label="إغلاق">×</button></div>
<div id="ci"></div>
<div class="fee" id="fe"></div>
<div class="tot"><span>الإجمالي</span><span id="ct"></span></div>
<div class="mode"><button id="m1" class="on">🍽️ داخل المطعم</button><button id="m2">🛵 توصيل للمنزل</button></div>
<div id="f1"><input id="tbl" inputmode="numeric" placeholder="رقم الطاولة"></div>
<div id="f2" style="display:none"><input id="nm" placeholder="الاسم"><input id="ph" type="tel" placeholder="رقم الموبايل"><textarea id="ad" rows="2" placeholder="العنوان بالتفصيل"></textarea><button type="button" id="lc" class="loc">📍 إرسال موقعي الحالي (اختياري)</button></div>
<textarea id="nt" rows="2" placeholder="ملاحظات الأكل (مثال: بدون بصل، سادة...)"></textarea>
<div class="err" id="er"></div>
<button class="send" id="sd">إرسال الطلب عبر واتساب</button>
</div></div>
<script>
const WA="201552561317", RESTAURANT="مشويات الشرق";
const V=(a,b,c,d)=>[["ربع كيلو",a],["ثلث كيلو",b],["نصف كيلو",c],["كيلو",d]];
const S=(a,b,c)=>[["صغير",a],["وسط",b],["كبير",c]].filter(x=>x[1]);
// ضع هنا رابط Google Sheet المنشور بصيغة CSV بين علامتي التنصيص
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRqpftJZOGd5ZGROMgc0b-IhFWY35qUSVH4LrxMhwqSaJCvT6Depb38srnTKTHf14xK7nJtm45oy-LU/pub?output=csv";
const DEFAULT=[
{id:"veal",name:"مشويات البتلو",items:[
["كباب بتلو",V(205,310,410,820)],["كفتة بتلو",V(175,265,350,700)],["فلتو بتلو",V(205,310,410,820)],
["مشكل كباب وكفتة",V(195,290,390,780)],["ريش بتلو",V(205,310,410,820)],["كلاوي بتلو",V(205,310,410,820)],
["كفتة شامي",V(185,275,370,740)],["كفتة طرب",V(205,310,410,820)],["كبدة مشوية بتلو",V(205,310,410,820)]]},
{id:"lamb",name:"مشويات الضاني",items:[
["ريش ضاني",V(215,325,430,860)],["كفتة ضاني",V(175,265,350,700)],["كباب ضاني",V(215,325,430,860)],
["بوفتيك ضاني",V(215,325,430,860)],["موزة ضاني",[["نصف كيلو",450]]],["كبدة ضاني",V(215,325,430,860)],["نيفة مشوي",V(215,325,430,860)]]},
{id:"bird",name:"مشويات الطيور",items:[
["فرخة مشوية على الفحم",[["فرخة",350]]],["نص فرخة مشوية",[["نصف",175]]],["ربع فرخة ورك",[["ربع",100]]],
["ربع فرخة صدر",[["ربع",110]]],["جوز حمام محشي أرز",[["جوز",300]]],["جوز حمام محشي فريك",[["جوز",300]]]]},
{id:"tagen",name:"الطواجن",items:[
["برام معمر باللحمة",[["",200]]],["طاجن خضار مشكل باللحمة",[["",180]]],["ورقة لحمة بالخضار",[["",200]]],
["برام كلاوي وحلويات",[["",200]]],["طاجن عكاوي",[["",200]]]]},
{id:"rice",name:"الأرز والمحاشي",items:[
["وجبة ربع فرخة + أرز بسمتي + 3 كفتة",[["",190]]],
["كيلو محاشي منبار",S(125,250,500)],["محاشي مشكل + ممبار",S(0,0,150)],["أرز بسمتي",S(50,0,60)],
["محاشي ورق عنب",S(50,0,70)],["محاشي كوسة",S(50,0,70)],["محاشي فلفل",S(50,0,70)],["محاشي كرنب",S(50,0,70)],["محاشي باذنجان",S(50,0,70)]]},
{id:"sand",name:"الساندوتشات",items:[
["ساندوتش كفتة",[["",95]]],["ساندوتش كباب",[["",100]]],["ساندوتش بوفتيك",[["",100]]],
["ساندوتش طرب",[["",100]]],["ساندوتش كبدة",[["",100]]],["طبق بطاطس",[["",20]]],["طبق ملوخية",[["",20]]]]},
{id:"drink",name:"المشروبات",items:[["زجاجة مياه",[["",10]]],["كانز",[["",25]]]]}
];
let DATA=DEFAULT,loading=false,loc="";
// القيم الافتراضية: رسوم التوصيل والحد الأدنى (تتغير تلقائياً إذا وُجدت في الجدول)
const DELIVERY_FEE=15,MIN_ORDER=0;
let CFG={open:true,fee:DELIVERY_FEE,min:MIN_ORDER,wa:WA,name:RESTAURANT};
const $=id=>document.getElementById(id);
const cart={},sel={};let mode=1;
const fmt=n=>n.toLocaleString("ar-EG")+" ج";
const key=(i,o)=>i+"|"+o;
function render(){
 const t=$("q").value.trim();let h="";
 DATA.forEach(s=>{
  const its=s.items.map((it,i)=>[it,i]).filter(([it])=>!t||it[0].includes(t));
  if(!its.length)return;
  h+=`<h2 id="s-${s.id}">${s.name}</h2>`;
  its.forEach(([it,i])=>{
   const id=s.id+i,o=sel[id]??0,opts=it[1],p=opts[o],k=key(id,o),c=cart[k];
   h+=`<div class="card">${it[2]?`<img class="im" loading="lazy" src="${it[2]}" alt="" onerror="this.remove()">`:""}<div class="top"><span class="nm">${it[0]}${it[3]?`<span class="bd">${it[3]}</span>`:""}</span><span class="pr">${p[1]} <small>جنيه</small></span></div>`;
   if(opts.length>1)h+=`<div class="chips">${opts.map((x,j)=>`<button class="${j==o?"on":""}" onclick="pick('${id}',${j})">${x[0]} · ${x[1]}</button>`).join("")}</div>`;
   h+=`<div class="act">${c?`<div class="qty"><button onclick="chg('${k}',1)">+</button><b>${c.q}</b><button onclick="chg('${k}',-1)">−</button></div>`:`<button class="add" onclick="add('${s.id}',${i},${o})">➕ إضافة للسلة</button>`}</div></div>`;
  });
 });
 $("list").innerHTML=h||(loading?'<div class="empty">⏳ جاري تحميل المنيو...</div>':'<div class="empty">لا توجد أصناف مطابقة للبحث 🔎</div>');
 bar();
}
function pick(id,j){sel[id]=j;render()}
function add(s,i,o){const sec=DATA.find(x=>x.id==s),it=sec.items[i],p=it[1][o];cart[key(s+i,o)]={n:it[0],l:p[0],p:p[1],q:1};render();if($("sheet").classList.contains("open"))cartUI()}
function chg(k,d){cart[k].q+=d;if(cart[k].q<=0)delete cart[k];render();cartUI()}
function tot(){let n=0,t=0;Object.values(cart).forEach(c=>{n+=c.q;t+=c.q*c.p});return[n,t]}
function bar(){const[n,t]=tot();$("fab").style.display=n?"block":"none";$("fc").textContent=n+" صنف";$("ft").textContent=fmt(t)}
function cartUI(){
 const e=Object.entries(cart),[n,t]=tot();
 $("ci").innerHTML=e.length?e.map(([k,c])=>`<div class="row"><div class="t">${c.n}<small>${c.l?c.l+" · ":""}${c.p} ج</small></div><div class="q2"><button onclick="chg('${k}',1)">+</button><b>${c.q}</b><button onclick="chg('${k}',-1)">−</button></div><b>${c.q*c.p}</b></div>`).join(""):'<div class="empty">السلة فارغة</div>';
 const fee=mode==2&&n?CFG.fee:0;$("fe").innerHTML=fee?"<span>🛵 رسوم التوصيل</span><b>"+fmt(fee)+"</b>":"";$("ct").textContent=fmt(t+fee);
 if(!n)$("sheet").classList.remove("open");
}
function setMode(m){mode=m;$("m1").classList.toggle("on",m==1);$("m2").classList.toggle("on",m==2);$("f1").style.display=m==1?"block":"none";$("f2").style.display=m==2?"block":"none";$("er").textContent="";cartUI()}
$("m1").onclick=()=>setMode(1);$("m2").onclick=()=>setMode(2);
$("fabBtn").onclick=()=>{cartUI();$("sheet").classList.add("open")};
$("cl").onclick=()=>$("sheet").classList.remove("open");
$("sheet").onclick=e=>{if(e.target.id=="sheet")$("sheet").classList.remove("open")};
$("q").oninput=render;
$("sd").onclick=()=>{
 const[n,t]=tot();if(!n)return;
 const v=id=>$(id).value.trim(),er=$("er");
 if(!CFG.open)return er.textContent="⛔ المطعم مغلق حالياً، لا يمكن إرسال الطلب الآن";
 let who,fee=0;
 if(mode==1){if(!v("tbl"))return er.textContent="من فضلك اكتب رقم الطاولة";who="🍽️ *داخل المطعم*\n🪑 رقم الطاولة: "+v("tbl")}
 else{
  if(!v("nm")||!v("ph")||!v("ad"))return er.textContent="من فضلك اكتب الاسم ورقم الموبايل والعنوان";
  if(CFG.min&&t<CFG.min)return er.textContent="الحد الأدنى لطلب التوصيل "+CFG.min+" جنيه";
  fee=CFG.fee;who="🛵 *توصيل للمنزل*\n👤 الاسم: "+v("nm")+"\n📞 الموبايل: "+v("ph")+"\n📍 العنوان: "+v("ad");
  if(loc)who+="\n🗺️ الموقع على الخريطة: https://maps.google.com/?q="+loc;
 }
 try{localStorage.setItem("cust",JSON.stringify({nm:v("nm"),ph:v("ph"),ad:v("ad"),tbl:v("tbl")}))}catch(e){}
 let m="🧾 *فاتورة طلب جديد — "+CFG.name+"*\n🕒 "+new Date().toLocaleString("ar-EG")+"\n━━━━━━━━━━━━━━\n"+who+"\n━━━━━━━━━━━━━━\n";
 Object.values(cart).forEach((c,i)=>{m+=(i+1)+". "+c.n+(c.l?" ("+c.l+")":"")+"\n    "+c.q+" × "+c.p+" = *"+c.q*c.p+" ج*\n"});
 m+="━━━━━━━━━━━━━━\n🔢 عدد الأصناف: "+n+"\n🧮 المجموع: "+t+" جنيه\n";
 if(fee)m+="🛵 رسوم التوصيل: "+fee+" جنيه\n";
 m+="💰 *الإجمالي: "+(t+fee)+" جنيه*\n";
 if(v("nt"))m+="📝 ملاحظات: "+v("nt")+"\n";
 m+="━━━━━━━━━━━━━━\nشكراً لطلبكم 🙏";
 er.textContent="";
 const u="https://wa.me/"+CFG.wa+"?text="+encodeURIComponent(m);
 er.innerHTML='<a href="'+u+'" target="_blank" rel="noopener" style="color:#1fa855;font-weight:700;font-size:15px">إذا لم يفتح واتساب اضغط هنا لفتحه 👈</a>';
 const k=document.createElement("a");k.href=u;k.target="_blank";k.rel="noopener";document.body.appendChild(k);k.click();k.remove();
};
$("lc").onclick=()=>{
 if(!navigator.geolocation){$("er").textContent="المتصفح لا يدعم تحديد الموقع";return}
 $("lc").textContent="⏳ جاري تحديد الموقع...";
 try{navigator.geolocation.getCurrentPosition(p=>{loc=p.coords.latitude.toFixed(6)+","+p.coords.longitude.toFixed(6);$("lc").textContent="✅ تم تحديد موقعك"},()=>{$("lc").textContent="📍 تعذر تحديد الموقع، اضغط للمحاولة";$("er").textContent="لم يُسمح بتحديد الموقع. يمكنك إرسال موقعك من واتساب بعد فتح المحادثة (📎 ← الموقع) أو كتابة العنوان بالتفصيل"},{enableHighAccuracy:true,timeout:15000})}catch(e){$("lc").textContent="📍 غير متاح";$("er").textContent="تحديد الموقع غير متاح هنا، اكتب العنوان بالتفصيل أو أرسل موقعك من واتساب"}
};
function loadCust(){try{const c=JSON.parse(localStorage.getItem("cust")||"{}");["nm","ph","ad","tbl"].forEach(k=>{if(c[k])$(k).value=c[k]})}catch(e){}}
function applyCfg(){$("rn").textContent="🔥 "+CFG.name;document.title="منيو "+CFG.name;$("cb").style.display=CFG.open?"none":"block";$("sd").textContent=CFG.open?"إرسال الطلب عبر واتساب":"⛔ المطعم مغلق حالياً";$("sd").style.opacity=CFG.open?1:.5}
function buildTabs(){$("tabs").innerHTML=DATA.map(s=>`<button data-s="${s.id}">${s.name}</button>`).join("")}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;$("q").value="";render();[...$("tabs").children].forEach(x=>x.classList.toggle("on",x==b));const el=document.getElementById("s-"+b.dataset.s);if(el){const y=el.getBoundingClientRect().top+window.pageYOffset-document.querySelector(".bar").offsetHeight-8;window.scrollTo(0,Math.max(0,y))}};
function csv(t){const r=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){row.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;row.push(c);r.push(row);row=[];c=""}else c+=ch}row.push(c);r.push(row);return r}
function fromRows(rows){
 const secs=[],map={},c={},num=x=>parseFloat((x||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d.]/g,""));
 rows.forEach(r=>{
  const[s,n,z,p,a,im,bd]=r.map(x=>(x||"").trim());
  if(s==="إعدادات"){const val=z||p;
   if(n==="حالة المطعم")c.open=!/^(مغلق|لا|no|closed|false|0)/i.test(val);
   else if(n==="رسوم التوصيل")c.fee=num(val)||0;
   else if(n==="حد أدنى للتوصيل")c.min=num(val)||0;
   else if(n==="رقم الكاشير"){let d=val.replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x)).replace(/\D/g,"");if(d.startsWith("0"))d="20"+d.slice(1);if(d)c.wa=d}
   else if(n==="اسم المطعم"&&val)c.name=val;
   return}
  const pr=num(p);if(!s||!n||!(pr>0))return;
  if(a&&/^(لا|no|0|false|x)$/i.test(a))return;
  let sec=map[s];if(!sec){sec=map[s]={id:"c"+secs.length,name:s,items:[],idx:{}};secs.push(sec)}
  let it=sec.idx[n];if(!it){it=[n,[],"",""];sec.idx[n]=it;sec.items.push(it)}
  it[1].push([z,pr]);
  if(im&&!it[2]&&/^https?:\/\//i.test(im))it[2]=im.replace(/"/g,"%22");
  if(bd&&!it[3])it[3]=bd.replace(/[<>]/g,"");
 });
 return{d:secs.filter(s=>s.items.length).map(({id,name,items})=>({id,name,items})),c};
}
async function loadSheet(){
 if(!SHEET_URL)return;const K="menu_cache2";let cached=false;
 try{const o=JSON.parse(localStorage.getItem(K)||"null");if(o&&o.d&&o.d.length){DATA=o.d;Object.assign(CFG,o.c);cached=true}}catch(e){}
 if(!cached){DATA=[];loading=true}
 buildTabs();applyCfg();render();
 try{
  const res=await fetch(SHEET_URL+(SHEET_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw new Error(res.status);
  const o=fromRows(csv(await res.text()));
  if(!o.d.length)throw new Error("empty");
  DATA=o.d;Object.assign(CFG,o.c);try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}
 }catch(e){console.error(e);if(!cached)DATA=DEFAULT}
 loading=false;buildTabs();applyCfg();render();cartUI();
}
buildTabs();applyCfg();loadCust();render();loadSheet();
